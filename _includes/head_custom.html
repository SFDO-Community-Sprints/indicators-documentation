<!-- Reading/scroll progress bar. Runtime-only by necessity (depends on the
     visitor's live scroll position, unlike the build-time reading-time
     include) — a thin fixed bar at the top of the viewport, filled by how far
     down the page the reader has scrolled. -->
<style>
  #reading-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 5px;
    width: 0%;
    background: #fb923c;
    z-index: 10000;
    transition: width 0.1s ease-out;
  }
</style>
<script>
(function () {
  document.addEventListener("DOMContentLoaded", function () {
    var bar = document.createElement("div");
    bar.id = "reading-progress-bar";
    document.body.appendChild(bar);

    function update() {
      var scrollTop = window.scrollY || document.documentElement.scrollTop;
      var docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      bar.style.width = pct + "%";
    }

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  });
})();
</script>

<!-- Local-preview dark mode toggle. just-the-docs' color_scheme is a build-time
     Sass choice (baked into just-the-docs-default.css); the theme happens to
     also publish just-the-docs-light.css/-dark.css as separate assets, so this
     just swaps which one is active at runtime instead of needing two builds.
     Sets data-theme on <html>, then calls window.mermaidRerender() (exposed by
     the local _includes/components/mermaid.html override) to re-theme any
     Mermaid diagram on the page to match. -->
<link rel="stylesheet" id="color-scheme-override">
<script>
(function () {
  var STYLESHEETS = {
    light: "{{ '/assets/css/just-the-docs-light.css' | relative_url }}",
    dark: "{{ '/assets/css/just-the-docs-dark.css' | relative_url }}"
  };
  var STORAGE_KEY = "color-scheme-override";

  function getPreferred() {
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (saved === "light" || saved === "dark") return saved;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function apply(theme) {
    document.getElementById("color-scheme-override").href = STYLESHEETS[theme];
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("color-scheme-toggle-btn");
    if (btn) btn.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
    if (window.mermaidRerender) window.mermaidRerender();
  }

  var current = getPreferred();
  apply(current);

  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.createElement("button");
    btn.id = "color-scheme-toggle-btn";
    btn.type = "button";
    btn.style.cssText = "position:fixed;bottom:16px;right:16px;z-index:9999;padding:8px 14px;" +
      "border-radius:999px;border:1px solid rgba(128,128,128,.5);background:#222;color:#fff;" +
      "font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);";
    btn.textContent = current === "dark" ? "☀️ Light" : "🌙 Dark";
    btn.addEventListener("click", function () {
      current = current === "dark" ? "light" : "dark";
      try { localStorage.setItem(STORAGE_KEY, current); } catch (e) {}
      apply(current);
    });
    document.body.appendChild(btn);
  });
})();
</script>
